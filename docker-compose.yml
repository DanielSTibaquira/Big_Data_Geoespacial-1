services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taxi_geospatial
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  dask-scheduler:
    image: daskdev/dask:2026.8.0-py3.12
    restart: unless-stopped
    command:
      - dask-scheduler
      - --host
      - 0.0.0.0
      - --port
      - "8786"
      - --dashboard-address
      - 0.0.0.0:8787
    ports:
      - "127.0.0.1:8786:8786"
      - "127.0.0.1:8787:8787"

  dask-worker-1:
    image: daskdev/dask:2026.8.0-py3.12
    restart: unless-stopped
    command:
      - dask-worker
      - tcp://dask-scheduler:8786
      - --nthreads
      - "1"
      - --memory-limit
      - 1GiB
    depends_on:
      - dask-scheduler
    volumes:
      - ./data:/data:ro

  dask-worker-2:
    image: daskdev/dask:2026.8.0-py3.12
    restart: unless-stopped
    command:
      - dask-worker
      - tcp://dask-scheduler:8786
      - --nthreads
      - "1"
      - --memory-limit
      - 1GiB
    depends_on:
      - dask-scheduler
    volumes:
      - ./data:/data:ro

  spark-master:
    image: apache/spark:3.5.7
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"

  spark-worker:
    image: apache/spark:3.5.7
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 1g
      SPARK_WORKER_WEBUI_PORT: "8081"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "127.0.0.1:8082:8081"

  ingest:
    build:
      context: ./ingestion
    profiles:
      - jobs
    environment:
      DATA_PATH: /data/train.csv
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: taxi_geospatial
      MONGO_COLLECTION: trips
      DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:8786
      DASK_EXPECTED_WORKERS: "2"
    volumes:
      - ./data:/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
      dask-scheduler:
        condition: service_started
      dask-worker-1:
        condition: service_started
      dask-worker-2:
        condition: service_started

volumes:
  mongodb_data:
