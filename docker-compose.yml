services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: taxi_geospatial
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  dask-scheduler:
    image: daskdev/dask:2026.8.0-py3.12
    restart: unless-stopped
    command:
      - dask-scheduler
      - --host
      - 0.0.0.0
      - --port
      - "8786"
      - --dashboard-address
      - 0.0.0.0:8787
    ports:
      - "127.0.0.1:8786:8786"
      - "127.0.0.1:8787:8787"

  dask-worker-1:
    image: daskdev/dask:2026.8.0-py3.12
    restart: unless-stopped
    command:
      - dask-worker
      - tcp://dask-scheduler:8786
      - --nthreads
      - "1"
      - --memory-limit
      - 1GiB
    depends_on:
      - dask-scheduler
    volumes:
      - ./data:/data:ro

  dask-worker-2:
    image: daskdev/dask:2026.8.0-py3.12
    restart: unless-stopped
    command:
      - dask-worker
      - tcp://dask-scheduler:8786
      - --nthreads
      - "1"
      - --memory-limit
      - 1GiB
    depends_on:
      - dask-scheduler
    volumes:
      - ./data:/data:ro

  spark-master:
    image: lifemap-spark:3.5.7
    build:
      context: ./spark
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: "7077"
      SPARK_MASTER_WEBUI_PORT: "8080"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    volumes:
      - ./spark:/opt/spark-apps:ro
      - ./benchmark:/opt/benchmark:ro
      - ./data:/data:ro
      - ./data/lifemap:/lifemap
      - ./benchmark/results:/results

  spark-worker:
    image: lifemap-spark:3.5.7
    build:
      context: ./spark
    restart: unless-stopped
    environment:
      SPARK_NO_DAEMONIZE: "true"
      SPARK_WORKER_CORES: "1"
      SPARK_WORKER_MEMORY: 2g
      SPARK_WORKER_WEBUI_PORT: "8081"
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
    depends_on:
      - spark-master
    ports:
      - "127.0.0.1:8082:8081"
    volumes:
      - ./spark:/opt/spark-apps:ro
      - ./benchmark:/opt/benchmark:ro
      - ./data:/data:ro
      - ./data/lifemap:/lifemap

  api:
    image: taxi-geospatial-api:local
    build:
      context: ./api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: taxi_geospatial
      MONGO_COLLECTION: trips
      MONGO_AGGREGATES_COLLECTION: trip_aggregates
      LIFEMAP_DATABASE: lifemap
      LIFEMAP_BUSINESSES_COLLECTION: businesses
      LIFEMAP_REVIEWS_COLLECTION: reviews
      LIFEMAP_CLOSURE_COLLECTION: closure_rates
      LIFEMAP_MODEL_PATH: /lifemap/model_serving.json
      SPARK_MASTER_HOST: spark-master
      DASK_SCHEDULER_HOST: dask-scheduler
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./data/lifemap:/lifemap:ro
    depends_on:
      mongodb:
        condition: service_healthy
      dask-scheduler:
        condition: service_started
      spark-master:
        condition: service_started

  benchmark-dask:
    image: daskdev/dask:2026.8.0-py3.12
    profiles:
      - benchmark
    environment:
      PYTHONPATH: /opt
    working_dir: /opt/benchmark
    entrypoint: ["python", "dask_aggregate.py"]
    volumes:
      - ./benchmark:/opt/benchmark:ro
      - ./data:/data:ro
      - ./benchmark/results:/results

  benchmark-spark:
    image: apache/spark:3.5.7
    profiles:
      - benchmark
    environment:
      PYTHONPATH: /opt
    working_dir: /opt/benchmark
    entrypoint: ["/opt/spark/bin/spark-submit"]
    volumes:
      - ./benchmark:/opt/benchmark:ro
      - ./data:/data:ro
      - ./benchmark/results:/results

  api-ci:
    image: taxi-geospatial-api:local
    build:
      context: ./api
    profiles:
      - ci-deploy
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: taxi_geospatial
      MONGO_COLLECTION: trips
      MONGO_AGGREGATES_COLLECTION: trip_aggregates
      LIFEMAP_DATABASE: lifemap
      LIFEMAP_BUSINESSES_COLLECTION: businesses
      LIFEMAP_REVIEWS_COLLECTION: reviews
      LIFEMAP_CLOSURE_COLLECTION: closure_rates
      LIFEMAP_MODEL_PATH: /lifemap/model_serving.json
      SPARK_MASTER_HOST: spark-master
      DASK_SCHEDULER_HOST: dask-scheduler
      GIT_COMMIT: ${GIT_COMMIT:-unknown}
    volumes:
      - ./data/lifemap:/lifemap:ro
    depends_on:
      mongodb:
        condition: service_healthy
      dask-scheduler:
        condition: service_started
      spark-master:
        condition: service_started

  jenkins:
    build:
      context: ./jenkins
    profiles:
      - ci
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-parcial}
    volumes:
      - jenkins_home:/var/jenkins_home
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"

  ingest:
    build:
      context: ./ingestion
    profiles:
      - jobs
    environment:
      DATA_PATH: /data/train.csv
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DATABASE: taxi_geospatial
      MONGO_COLLECTION: trips
      DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:8786
      DASK_EXPECTED_WORKERS: "2"
    volumes:
      - ./data:/data:ro
    depends_on:
      mongodb:
        condition: service_healthy
      dask-scheduler:
        condition: service_started
      dask-worker-1:
        condition: service_started
      dask-worker-2:
        condition: service_started

  yelp-ingest:
    build:
      context: ./ingestion
    profiles:
      - jobs
    entrypoint: ["python", "-m", "ingestion.yelp_ingest"]
    environment:
      KAGGLEHUB_CACHE: /data/kagglehub
      KAGGLE_CONFIG_DIR: /data/.kaggle-ci
      MONGO_URI: mongodb://mongodb:27017
      YELP_MONGO_DATABASE: lifemap
      YELP_BUSINESSES_COLLECTION: businesses
      YELP_REVIEWS_COLLECTION: reviews
      DASK_SCHEDULER_ADDRESS: tcp://dask-scheduler:8786
      DASK_EXPECTED_WORKERS: "2"
    volumes:
      - ./data:/data
    depends_on:
      mongodb:
        condition: service_healthy
      dask-scheduler:
        condition: service_started
      dask-worker-1:
        condition: service_started
      dask-worker-2:
        condition: service_started

volumes:
  mongodb_data:
  jenkins_home:
